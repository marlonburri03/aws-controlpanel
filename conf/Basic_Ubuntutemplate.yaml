#cloud-config


users:
  - name: marlob
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    homedir: /home/marlob
    shell: /bin/bash
    lock_passwd: false
    passwd: <sha512-crypt-hash-of-your-password>
    ssh_authorized_keys:
      - ssh-rsa  marlo@PC-BURRI
  

  - name: ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: sudo
    homedir: /home/ubuntu
    shell: /bin/bash
    passwd: np
    ssh_authorized_keys:
      - ssh-rsa  marlo@PC-BURRI
      - ssh-rsa AAAA...replace-with-a-team-member-key teammate@example.com
      - ssh-rsa AAAA...replace-with-a-team-member-key teammate@example.com

ssh_pwauth: true
disable_root: false
package_update: true 
packages:
  - curl
  - wget
  - vim
  - nano 
  - htop
  - net-tools

runcmd:
  - sudo touch /etc/cloud/cloud-init.disabled